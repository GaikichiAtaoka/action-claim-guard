name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: action-claim-guard --input examples/synthetic_input.json
      - name: Agent integration examples (supported and unsupported claims)
        run: |
          python examples/agent_integration.py > /dev/null
          python examples/agent_integration.py --skip-write > /dev/null
